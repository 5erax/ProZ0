name: p1-qa-002-hosted4-drain-save-evidence

on:
  push:
    branches:
      - evidence/p1-qa-hosted4-drain-save-r5
  pull_request:
    branches:
      - main
    paths:
      - tests/e2e/p1-qa-002-hosted4-drain-save.spec.ts
      - .github/workflows/p1-qa-002-hosted4-drain-save.yml

permissions:
  contents: read

jobs:
  hosted4-drain-save:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      P1_QA_HOSTED4_DRAIN_SAVE_EXPECTED_MAIN_SHA: e35870dbf89098a8b45a5935424e9f785b708aad
      P1_QA_HOSTED4_DRAIN_SAVE_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard evidence-only delta from exact product candidate
        shell: bash
        run: |
          set -euo pipefail
          expected="$P1_QA_HOSTED4_DRAIN_SAVE_EXPECTED_MAIN_SHA"
          actual_base="$(git merge-base "$expected" HEAD)"
          if [ "$actual_base" != "$expected" ]; then
            echo "Evidence branch is not based exactly on product candidate."
            echo "expected=$expected actual_base=$actual_base"
            exit 1
          fi
          git diff --name-only "$expected"..HEAD > changed.txt
          cat changed.txt
          unexpected="$(grep -Ev '^(tests/e2e/p1-qa-002-hosted4-drain-save\.spec\.ts|\.github/workflows/p1-qa-002-hosted4-drain-save\.yml)$' changed.txt || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected product/application delta:"
            echo "$unexpected"
            exit 1
          fi
          count="$(wc -l < changed.txt | tr -d ' ')"
          if [ "$count" -ne 2 ]; then
            echo "Expected exactly two evidence-only changed paths, found $count."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck evidence harness
        run: npm run typecheck

      - name: Build exact product candidate plus evidence-only harness
        run: npm run build

      - name: Run Hosted-4 reconnect drain/save reopen browser evidence
        run: npx playwright test tests/e2e/p1-qa-002-hosted4-drain-save.spec.ts --trace on

      - name: Upload Hosted-4 drain/save retained evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: p1-qa-002-hosted4-drain-save-evidence-${{ github.sha }}
          path: |
            test-results/p1-qa-002-hosted4-drain-save/
            test-results/p1-qa-002-hosted4-drain-save-*/
          if-no-files-found: warn
          retention-days: 30

      - name: Report retained artifact identity
        if: always()
        shell: bash
        run: |
          echo "artifact-id=${{ steps.upload.outputs.artifact-id }}"
          echo "artifact-digest=${{ steps.upload.outputs.artifact-digest }}"
          echo "workflow-run-id=${{ github.run_id }}"
