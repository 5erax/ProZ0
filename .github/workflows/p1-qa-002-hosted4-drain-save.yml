name: p1-qa-002-hosted4-drain-save-evidence

on:
  push:
    branches:
      - evidence/p1-qa-hosted4-drain-save
  pull_request:
    branches:
      - main
    paths:
      - tests/e2e/p1-qa-002-hosted4-drain-save.spec.ts
      - .github/workflows/p1-qa-002-hosted4-drain-save.yml

permissions:
  contents: read

jobs:
  hosted4_drain_save:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      P1_QA_HOSTED4_DRAIN_SAVE_EXPECTED_MAIN_SHA: 709b7b44e41916ff6330e3f153ce14ba66a328b3
      P1_QA_HOSTED4_DRAIN_SAVE_EVIDENCE_HEAD_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard evidence-only delta from exact candidate
        shell: bash
        run: |
          set -euo pipefail
          base="$P1_QA_HOSTED4_DRAIN_SAVE_EXPECTED_MAIN_SHA"
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base"..HEAD > changed.txt
          cat changed.txt
          unexpected="$(grep -Ev '^(tests/e2e/p1-qa-002-hosted4-drain-save\.spec\.ts|\.github/workflows/p1-qa-002-hosted4-drain-save\.yml)$' changed.txt || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected application/content delta:"
            echo "$unexpected"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck evidence harness
        run: npm run typecheck

      - name: Build exact candidate application tree
        run: npm run build

      - name: Run Hosted-4 reconnect drain-save reopen browser evidence
        run: npx playwright test tests/e2e/p1-qa-002-hosted4-drain-save.spec.ts

      - name: Upload Hosted-4 drain-save retained evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p1-qa-002-hosted4-drain-save-evidence-${{ github.sha }}
          path: |
            test-results/p1-qa-002-hosted4-drain-save/
            test-results/p1-qa-002-hosted4-drain-save-*/
          if-no-files-found: warn
          retention-days: 30
