name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Lint and architecture boundaries
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Determinism tests
        run: npm run test:determinism
      - name: Production build
        run: npm run build
      - name: Browser tests
        run: npm run test:browser
      - name: E2E smoke
        env:
          P0_TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:e2e

      - name: Upload P0-BUG-001 responsiveness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-bug-001-responsiveness-${{ github.sha }}
          path: test-results/p0-bug-001/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload P0-BUG-002 visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-bug-002-visual-evidence-${{ github.sha }}
          path: test-results/p0-bug-002/
          if-no-files-found: ignore
          retention-days: 30
