name: p1-qa-002-corrected-pages-browser

on:
  push:
    branches:
      - evidence/p1-qa-002-corrected-pages-browser
  pull_request:
    branches:
      - main
    paths:
      - tests/e2e/p1-qa-002-corrected-live-pages.spec.ts
      - .github/workflows/p1-qa-002-corrected-pages-browser.yml

permissions:
  contents: read

jobs:
  corrected-pages-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      P1_QA_CORRECTED_TARGET_URL: https://5erax.github.io/ProZ0/
      P1_QA_EXPECTED_MAIN_SHA: 4c1e6a2732d096783f8ec8c354479fdda03d5e7d
      P1_QA_EXPECTED_PAGES_RUN: 36243798830

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard evidence-only delta from accepted main
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$P1_QA_EXPECTED_MAIN_SHA"..HEAD > changed.txt
          cat changed.txt
          unexpected="$(grep -Ev '^(tests/e2e/p1-qa-002-corrected-live-pages\.spec\.ts|\.github/workflows/p1-qa-002-corrected-pages-browser\.yml)$' changed.txt || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected application/content delta:"
            echo "$unexpected"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build exact accepted application tree
        run: npm run build -- --base="/ProZ0/"

      - name: Run corrected live Pages browser verification
        run: npx playwright test tests/e2e/p1-qa-002-corrected-live-pages.spec.ts

      - name: Upload corrected Pages browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p1-qa-002-corrected-pages-browser-${{ github.sha }}
          path: |
            test-results/p1-qa-002-corrected-pages/
            test-results/p1-qa-002-corrected-live-pages-*/
          if-no-files-found: warn
          retention-days: 30
