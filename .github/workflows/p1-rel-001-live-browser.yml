name: p1-rel-001-live-browser-verification

on:
  push:
    branches:
      - task/p1-rel-001-live-browser-verification
  pull_request:
    branches:
      - main
    paths:
      - tests/e2e/p1-rel-001-live-pages.spec.ts
      - .github/workflows/p1-rel-001-live-browser.yml

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      P1_REL_TARGET_URL: https://5erax.github.io/ProZ0/
      P1_REL_EXPECTED_SHA: 7a566d29b631f24b608f6661267be2ed786f265f

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release branch changes are evidence-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$P1_REL_EXPECTED_SHA"..HEAD > changed.txt
          cat changed.txt
          unexpected="$(grep -Ev '^(tests/e2e/p1-rel-001-live-pages\.spec\.ts|\.github/workflows/p1-rel-001-live-browser\.yml)$' changed.txt || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected app delta versus accepted main:"
            echo "$unexpected"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build exact accepted app content
        run: npm run build -- --base="/ProZ0/"

      - name: Run live GitHub Pages browser verification
        run: npx playwright test tests/e2e/p1-rel-001-live-pages.spec.ts

      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p1-rel-001-live-browser-evidence-${{ github.sha }}
          path: |
            test-results/p1-rel-001-live-browser/
            test-results/p1-rel-001-live-pages-*/
          if-no-files-found: warn
          retention-days: 30
