name: bootstrap-package-lock
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ github.head_ref == 'p0-eng-001-bootstrap-runtime' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate package-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package-lock when missing or changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm lockfile"
          git push
